[project]
name = "momo-tune"
version = "0.1.0"
description = "MomoTune 日系二次元风格网易云 / 酷狗 / QQ音乐点歌 GsCore 插件"
requires-python = ">=3.11"
# qqmusic-api-python 为可选依赖，启用 QQ 音乐功能前需在 GsCore
# 所用 Python 环境中安装：
#   pip install "momo-tune[qqmusic]"
# 或单独安装：
#   pip install "qqmusic-api-python>=0.7.2"
# 安装后重启 Core 即可生效。
dependencies = [
    "httpx>=0.27.0",
    "pytakumi>=0.1.0",
]

[project.optional-dependencies]
qqmusic = ["qqmusic-api-python>=0.7.2"]

[tool.gsuid]
plugin_name = "MomoTune"
